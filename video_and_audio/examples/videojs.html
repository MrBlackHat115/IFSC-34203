<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Conner Woods">
    <title>Video.js player</title>

    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <header>
        <h1>Video.js player</h1>
        <p>Here is an example of a video player implemented using the Video.js library</p>
    </header>

    <main>

    <section class="video_container">
        <script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/html/cdn/video.js"></script>

            <video-player>
                <video-skin>
                    <video src="../assets/video/background_loop.mp4" playsinline></video>
                </video-skin>
            </video-player>
    </section>

    </main>

</body>
</html>
